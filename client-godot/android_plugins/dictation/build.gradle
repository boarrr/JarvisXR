plugins {
    id 'com.android.library' version '8.5.2'
}

android {
    namespace 'com.spatialagent.dictation'
    compileSdk 35

    defaultConfig {
        minSdk 29
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Provided by the Godot Android build template. Match your Godot version.
    compileOnly 'org.godotengine:godot:4.7.0.stable'
}
